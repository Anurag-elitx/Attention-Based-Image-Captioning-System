services:
  - type: web
    name: captioning-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    repo: https://github.com/Anurag-elitx/Attention-Based-Image-Captioning-System
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: captioning-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEVICE
        value: cpu
      - key: HF_MODEL_REPO
        sync: false
      - key: HF_TOKEN
        sync: false

  - type: web
    name: captioning-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    repo: https://github.com/Anurag-elitx/Attention-Based-Image-Captioning-System
    plan: free

databases:
  - name: captioning-db
    plan: free
    databaseName: captiondb
    user: captionuser
