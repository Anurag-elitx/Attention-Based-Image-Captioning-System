version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./ml:/app/ml
    environment:
      - DATABASE_URL=sqlite:///./data/captiondb.sqlite
      - DEVICE=cpu
      # Exclude DB dependency for pure local dev with SQLite
    depends_on: []

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - api

  # db is omitted in dev if using sqlite, or can be kept if testing postgres locally
